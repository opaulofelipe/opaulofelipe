name: Atualizar linguagens

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "README.md"
      - "scripts/generate_languages.py"
      - ".github/workflows/update-languages.yml"

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar gráficos
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: opaulofelipe
        run: python3 scripts/generate_languages.py

      - name: Salvar gráficos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/languages-light.svg
          git add profile/languages-dark.svg

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas estatísticas."
            exit 0
          fi

          git commit -m "Atualiza estatísticas de linguagens"
          git push origin HEAD:main
