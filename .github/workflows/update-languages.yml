name: Atualizar linguagens

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/generate_languages.py"
      - ".github/workflows/update-languages.yml"

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar gráficos
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: opaulofelipe
        run: python3 scripts/generate_languages.py

      - name: Atualizar versão das imagens no README
        run: |
          VERSION="$(date +%s)"

          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          base = "https://raw.githubusercontent.com/opaulofelipe/opaulofelipe/main/profile"

          for theme in ("light", "dark"):
              filename = f"languages-{theme}.svg"
              pattern = re.compile(
                  rf'(?:\./profile/{re.escape(filename)}|'
                  rf'https://raw\.githubusercontent\.com/opaulofelipe/opaulofelipe/main/profile/{re.escape(filename)})'
                  rf'(?:\?v=[^"\s>]*)?'
              )
              replacement = f"{base}/{filename}?v={version}"
              text = pattern.sub(replacement, text)

          readme.write_text(text, encoding="utf-8")
          PY

      - name: Salvar gráficos e README no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/languages-light.svg
          git add profile/languages-dark.svg
          git add README.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit -m "Atualiza estatísticas de linguagens"
          git push origin HEAD:main
